[package]
name = "villanelle"
version = "0.291.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/apology-is-policy/villanelle"
description = "Experimental Villanelle language and reference interpreter"
default-run = "vnc"

[lib]
name = "tellur"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lsp-server = "0.10"
url = "2"
llvm-sys = { version = "=221.1.2", optional = true, features = ["prefer-static"] }

[build-dependencies]
cc = { version = "1", optional = true }

[features]
default = ["llvm"]
# Private runtime packaging flag; compiler source admission remains separate.
runtime-abi = []
llvm = ["dep:llvm-sys", "dep:cc"]
linux-musl-packs = ["llvm"]
windows-gnu-pack = ["llvm"]
thylacine-pack = ["llvm"]

[[bin]]
name = "vnc"
path = "src/bin/vnc.rs"

[[bin]]
name = "tellur"
path = "src/bin/tellur.rs"

[[bin]]
name = "tellurc"
path = "src/main.rs"

[[bin]]
name = "tellur-lsp"
path = "src/bin/tellur-lsp.rs"

# Compatibility commands for existing scripts.
[[bin]]
name = "pathc"
path = "src/bin/pathc.rs"

[[bin]]
name = "path-lsp"
path = "src/bin/path-lsp.rs"

[[example]]
name = "windows-coff-smoke"
path = "ci/windows-coff-smoke.rs"
required-features = ["llvm"]
