[package]
name = "tellur"
version = "0.241.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/apology-is-policy/tellur"
description = "Experimental Tellur language and reference interpreter"
default-run = "tellurc"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lsp-server = "0.10"
url = "2"
# The embedded LLVM backend (single-binary arc); off until it replaces the Rust backend.
llvm-sys = { version = "=221.1.2", optional = true, features = ["prefer-static"] }

[build-dependencies]
cc = { version = "1", optional = true }

[features]
llvm = ["dep:llvm-sys", "dep:cc"]

[[bin]]
name = "tellurc"
path = "src/main.rs"

[[bin]]
name = "tellur-lsp"
path = "src/bin/tellur-lsp.rs"

# Compatibility commands for existing scripts.
[[bin]]
name = "pathc"
path = "src/bin/pathc.rs"

[[bin]]
name = "path-lsp"
path = "src/bin/path-lsp.rs"
