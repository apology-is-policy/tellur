name: Windows compiler and language server
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/windows-host.yml
      - ci/check-native-parity.py
      - ci/check-windows-host.py
      - ci/prepare-windows-crt.py
      - ci/prepare-windows-llvm-xml.py
      - tests/llvm_backend.rs
      - tests/cancellation_specimen.rs
      - tests/async_adapters.rs
      - tests/fixtures/readiness_stream.rs
      - tests/settings_http.rs
      - src/native.rs
      - src/rust_host.rs
      - build.rs
      - runtime/target_packs.rs
      - src/native/llvm_target.rs

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  RUSTUP_TOOLCHAIN: 1.97.1

jobs:
  native:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Locate native build inputs
        shell: pwsh
        run: |
          "LLVM_SYS_221_PREFIX=$env:RUNNER_TEMP/tellur-llvm-msvc" >> $env:GITHUB_ENV
          "TELLUR_WINDOWS_DLLTOOL=$env:RUNNER_TEMP/tellur-llvm-msvc/bin/llvm-dlltool.exe" >> $env:GITHUB_ENV
          "TELLUR_WINDOWS_SYSROOT=$env:RUNNER_TEMP/tellur-windows-gnu" >> $env:GITHUB_ENV
          "TELLUR_NATIVE_TARGET_DIR=$env:RUNNER_TEMP/native-target" >> $env:GITHUB_ENV
      - uses: actions/cache/restore@v4
        id: llvm
        with:
          path: ${{ env.LLVM_SYS_221_PREFIX }}
          key: llvm-msvc-x64-22.1.8-d96c2cc1-libxml2-103f5197-v1
      - name: Prepare pinned static LLVM and LLD development libraries
        if: steps.llvm.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $name = "clang+llvm-22.1.8-x86_64-pc-windows-msvc"
          $archive = "$env:RUNNER_TEMP/llvm.tar.xz"
          curl.exe --fail --location --retry 3 --output $archive "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/$name.tar.xz"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $digest = (Get-FileHash $archive -Algorithm SHA256).Hash
          if ($digest -ne 'd96c2cc1736f4eb7fa43cb9bbdf56d93551a9ae0a9aadb9c99c3c3b2b712a234') { throw 'Unexpected Windows LLVM archive digest' }
          New-Item -ItemType Directory -Force $env:LLVM_SYS_221_PREFIX | Out-Null
          tar.exe -xf $archive --strip-components 1 -C $env:LLVM_SYS_221_PREFIX "$name/include" "$name/lib/*.lib" "$name/bin/llvm-config.exe" "$name/bin/llvm-dlltool.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($lib in 'lldCOFF', 'lldELF', 'lldMachO', 'lldCommon') {
            if (!(Test-Path "$env:LLVM_SYS_221_PREFIX/lib/$lib.lib")) { throw "Missing $lib" }
          }
          python ci/prepare-windows-llvm-xml.py $env:LLVM_SYS_221_PREFIX
      - uses: actions/cache/save@v4
        if: steps.llvm.outputs.cache-hit != 'true'
        with:
          path: ${{ env.LLVM_SYS_221_PREFIX }}
          key: ${{ steps.llvm.outputs.cache-primary-key }}
      - name: Build the Windows-hosted compiler
        shell: pwsh
        run: |
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --target x86_64-pc-windows-gnu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ci/prepare-windows-crt.py $env:TELLUR_WINDOWS_SYSROOT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS = "-Ctarget-feature=+crt-static"
          cargo build --target x86_64-pc-windows-msvc --release --locked --features windows-gnu-pack --bin tellur
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Package the Windows CLI and VS Code extension
        shell: pwsh
        run: |
          $version = (Get-Content editors/vscode/package.json -Raw | ConvertFrom-Json).version
          $dist = "$env:GITHUB_WORKSPACE/dist"
          New-Item -ItemType Directory -Force $dist, editors/vscode/server | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/tellur.exe editors/vscode/server/tellur.exe
          Copy-Item "$env:LLVM_SYS_221_PREFIX/libxml2-Copyright.txt" editors/vscode/server/libxml2-Copyright.txt
          Compress-Archive -LiteralPath target/x86_64-pc-windows-msvc/release/tellur.exe, LICENSE, editors/vscode/server/libxml2-Copyright.txt -DestinationPath "$dist/tellur-$version-win32-x64.zip"
          Set-Location editors/vscode
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./node_modules/.bin/vsce.cmd package --no-dependencies --target win32-x64 --out "$dist/tellur-$version-win32-x64.vsix"
      - name: Qualify the packaged Windows compiler and stdio LSP
        run: python ci/check-windows-host.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: tellur-win32-x64
          path: dist/*
          if-no-files-found: error
          compression-level: 0

      - name: Run the full native Windows compiler parity suite
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS = "-Ctarget-feature=+crt-static"
          $env:CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUSTFLAGS = "-Cdlltool=$env:TELLUR_WINDOWS_DLLTOOL"
          python ci/check-native-parity.py
