name: Windows COFF smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/windows-coff.yml
      - ci/windows-coff-smoke.rs
      - ci/prepare-windows-crt.py
      - ci/check-release.py
      - Cargo.toml
      - src/native/llvm_target.rs
      - src/native/targets/x86_64-pc-windows-gnu/**
      - runtime/**
      - src/native/runtime.rs
      - src/native/windows_readiness.rs
      - src/llvm.rs
      - src/llvm/lld_shim.cpp

env:
  CARGO_INCREMENTAL: '0'
  RUSTUP_TOOLCHAIN: 1.97.1

permissions:
  contents: read

jobs:
  link:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select pinned toolchain
        run: |
          echo "LLVM_SYS_221_PREFIX=$RUNNER_TEMP/tellur-llvm-22.1.8" >> "$GITHUB_ENV"
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - uses: actions/cache@v4
        id: llvm
        with:
          path: ${{ runner.temp }}/tellur-llvm-22.1.8
          key: llvm-22.1.8-macos-15-${{ hashFiles('ci/build-llvm.sh') }}
      - if: steps.llvm.outputs.cache-hit != 'true'
        run: bash ci/build-llvm.sh "$LLVM_SYS_221_PREFIX"
      - name: Prepare the pinned Windows x64 target libraries
        run: |
          rustup target add x86_64-pc-windows-gnu
          rustup component add llvm-tools-preview
          rust_lib="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin"
          ln -s "$rust_lib/llvm-ar" "$RUNNER_TEMP/llvm-dlltool"
          python3 ci/prepare-windows-crt.py "$RUNNER_TEMP/windows-sysroot"
          echo "TELLUR_WINDOWS_SYSROOT=$RUNNER_TEMP/windows-sysroot" >> "$GITHUB_ENV"
          echo "TELLUR_WINDOWS_DLLTOOL=$RUNNER_TEMP/llvm-dlltool" >> "$GITHUB_ENV"
      - name: Emit COFF and link a PE executable using the embedded drivers
        run: |
          cargo build --locked --release --features windows-gnu-pack --bin tellur --example windows-coff-smoke
          PATH=/absent target/release/examples/windows-coff-smoke "$RUNNER_TEMP/coff"
      - name: Build Windows Hello and settings using the embedded link pack
        run: |
          target=x86_64-pc-windows-gnu
          compiler="$PWD/target/release/tellur"
          output="$RUNNER_TEMP/coff"
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUSTFLAGS="-Cdlltool=$TELLUR_WINDOWS_DLLTOOL" \
            "$compiler" pack-adapter applications/settings/main.tellur --target "$target" --out "$output/settings.adapter"
          export PATH=/absent TELLUR_NATIVE_TARGET_DIR="$RUNNER_TEMP/clean-windows-target"
          "$compiler" build playground/hello.tellur --target "$target" --out "$output/hello-standalone.exe"
          "$compiler" build applications/settings/main.tellur --target "$target" --adapter-pack "$output/settings.adapter" --out "$output/settings-standalone.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-coff-smoke
          path: |
            ${{ runner.temp }}/coff/exit.exe
            ${{ runner.temp }}/coff/hello.obj
            ${{ runner.temp }}/coff/*-standalone.exe
          if-no-files-found: error
  execute:
    needs: link
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: windows-coff-smoke
          path: probe
      - name: Check the process exit status on Windows x64
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./probe/exit.exe -Wait -PassThru
          if ($process.ExitCode -ne 42) { throw "Expected exit code 42, got $($process.ExitCode)" }
      - name: Run both standalone programs with an empty tool path
        run: python ci/check-release.py --windows-target probe
      - name: Build the runtime and check the compiled Tellur Hello program
        shell: pwsh
        run: |
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installation = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw "Cannot locate Visual C++ tools" }
          Import-Module "$installation\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          cargo test --locked --release --manifest-path runtime/Cargo.toml --features polled --lib --target-dir "$env:RUNNER_TEMP/runtime" windows_
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($profile in 'plain', 'polled') {
            $features = @()
            if ($profile -eq 'polled') { $features = @('--features', 'polled') }
            cargo build --locked --release --manifest-path runtime/Cargo.toml --target-dir "$env:RUNNER_TEMP/runtime" @features
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $exe = "$env:RUNNER_TEMP/hello-$profile.exe"
            link.exe /nologo /subsystem:console "/out:$exe" probe/hello.obj "$env:RUNNER_TEMP/runtime/release/tellur_runtime_abi.lib" kernel32.lib ntdll.lib userenv.lib ws2_32.lib dbghelp.lib msvcrt.lib
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $report = & $exe --json | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $report.outcome -ne 'done' -or $report.events[0].message -ne 'Hello from Tellur!') { throw "Unexpected $profile Hello result" }
          }
