name: v2 core and oracle
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/v2.yml
      - v2/**

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: never
  RUSTUP_TOOLCHAIN: 1.97.1

jobs:
  test:
    name: Tests, lints and the conformance suite
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Conformance suite through the command line
        run: cargo run --locked --bin vn2 -- test tests/slice1/*.core tests/slice1_surface/*.rails tests/slice2/*.core tests/slice2_surface/*.rails
      - name: Check Rails surface programs and validate certificates
        run: cargo run --locked --bin vn2 -- check tests/slice1_surface/*.rails tests/slice2_surface/*.rails
      - name: Check canonical Rails surface formatting
        run: cargo run --locked --bin vn2 -- format tests/slice1_surface/show_file.rails tests/slice1_surface/groups_and_auto.rails tests/slice1_surface/loops_and_paths.rails tests/slice2_surface/*.rails --check
      - name: Expand calls (Theorem 4) and emit Phase 4 typed LLVM IR and C ABI
        run: |
          cargo run --locked --bin vn2 -- expand tests/slice1_surface/groups_and_auto.rails > /dev/null
          cargo run --locked --bin vn2 -- emit-llvm tests/slice1_surface/spend.rails > /dev/null
          cargo run --locked --bin vn2 -- emit-c tests/slice1_surface/spend.rails > /dev/null
