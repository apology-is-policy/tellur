name: v2 core and oracle
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/v2.yml
      - v2/**

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: never
  RUSTUP_TOOLCHAIN: 1.97.1

jobs:
  test:
    name: Tests, lints and the conformance suite
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Conformance suite through the command line
        run: cargo run --locked --bin vn2 -- test tests/slice1/*.core tests/slice1_surface/*.rails
