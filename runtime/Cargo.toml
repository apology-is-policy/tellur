[package]
name = "tellur_runtime_abi"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
path = "lib.rs"
crate-type = ["staticlib"]
test = false
doctest = false

[features]
default = ["runtime-abi"]
runtime-abi = []
polled = ["dep:tellur_mio"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_os = "thylacine"))'.dependencies]
tellur_mio = { package = "mio", version = "1", optional = true, features = ["os-poll", "os-ext"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("thylacine"))'] }

[workspace]

# Retain the checked arithmetic of the previously shipped optimized dev runtime.
[profile.release]
opt-level = 2
debug-assertions = true
overflow-checks = true
